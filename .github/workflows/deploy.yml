name: Build and deploy to Kubernetes

on:
  push:
    branches:
      - sashXD
      - dev
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/poeeeri/reverse-gantt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: [self-hosted, k8s-deployer]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select environment
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_NAME=prod" >> "$GITHUB_ENV"
            echo "NAMESPACE=prod" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=reverse-gantt-api-prod" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "qa" ]; then
            echo "ENV_NAME=qa" >> "$GITHUB_ENV"
            echo "NAMESPACE=qa" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=reverse-gantt-api-qa" >> "$GITHUB_ENV"
          else
            echo "ENV_NAME=dev" >> "$GITHUB_ENV"
            echo "NAMESPACE=dev" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=reverse-gantt-api-dev" >> "$GITHUB_ENV"
          fi

      - name: Deploy with Helm
        shell: bash
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/app \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "./helm/app/values-$ENV_NAME.yaml" \
            --set image.repository="${{ env.IMAGE_NAME }}" \
            --set image.tag="${{ github.sha }}" \
            --set-string connectionStrings.defaultConnection="${{ secrets.K8S_DEFAULT_CONNECTION }}" \
            --set-string jwt.key="${{ secrets.JWT_KEY }}"

      - name: Wait for rollout
        shell: bash
        run: |
          kubectl rollout status deployment/"$RELEASE_NAME" -n "$NAMESPACE" --timeout=180s

      - name: Show deployed resources
        shell: bash
        run: |
          kubectl get all -n "$NAMESPACE"
